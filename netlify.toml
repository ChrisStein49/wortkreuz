[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
# Netlify is only the test site (wortkreuz.netlify.app): keep it out of search
# engines. The official site (geschnatter.ganzgraz.at, Cloudflare) is indexed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"